<div id="contact" class="text-center">
  <div class="container">
    <div class="section-title center" style="padding-top: 0; padding-bottom: 20px;">
      <h2>Contact</h2>
      <hr>
    </div>
    <div class="col-md-8 col-md-offset-2">
      <div class="social" style="margin-top: 0;">
        <ul>
          {% for link in site.data.social %}
          <li>
            <a target="_blank" href="{{ link.url }}">
              <i class="fa {{ link.icon }}"></i>
            </a>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</div>
