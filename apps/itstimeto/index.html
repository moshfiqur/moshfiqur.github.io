<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Time's Up, Buttercup</title>
	<style>
		/* ── Variables ── */
		:root {
			--bg-0: #070b12;
			--bg-1: #0b1220;
			--bg-2: #111827;
			--line: rgba(148, 163, 184, 0.14);
			--text: #e2e8f0;
			--muted: #9aa8c7;
			--accent: #00d4ff;
			--accent-2: #3df6b8;
			--danger: #ff6b81;
		}

		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

		/* ── Background ── */
		body {
			min-height: 100vh;
			color: var(--text);
			font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
			background:
				radial-gradient(circle at 20% -10%, rgba(0, 212, 255, 0.25), transparent 35%),
				radial-gradient(circle at 85% 10%, rgba(61, 246, 184, 0.18), transparent 35%),
				radial-gradient(circle at 50% 120%, rgba(20, 184, 166, 0.25), transparent 45%),
				linear-gradient(125deg, var(--bg-0), var(--bg-1) 55%, var(--bg-2));
			overflow-x: hidden;
		}

		body::before, body::after {
			content: "";
			position: fixed;
			width: 420px;
			height: 420px;
			filter: blur(80px);
			border-radius: 50%;
			opacity: 0.3;
			pointer-events: none;
			animation: floatBlob 16s ease-in-out infinite;
			z-index: 0;
		}

		body::before { background: #22d3ee; top: -100px; left: -80px; }
		body::after  { background: #34d399; right: -120px; bottom: -90px; animation-delay: -6s; }

		#app { min-height: 100vh; position: relative; z-index: 1; }

		/* ── Navigation ── */
		.app-nav {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 20px 40px 16px;
			border-bottom: 1px solid var(--line);
		}

		.nav-left { display: flex; align-items: center; gap: 10px; }

		.nav-home-link {
			color: var(--accent);
			text-decoration: none;
			font-size: 0.8rem;
			font-weight: 700;
			letter-spacing: 0.13em;
			text-transform: uppercase;
			position: relative;
			padding-bottom: 6px;
		}

		.nav-home-link::after {
			content: "";
			position: absolute;
			left: 0; right: 0; bottom: 0;
			height: 2px;
			background: var(--accent);
			border-radius: 2px;
		}

		.nav-active-dot {
			width: 7px; height: 7px;
			border-radius: 50%;
			background: var(--accent-2);
			flex-shrink: 0;
			animation: pulseDot 2s ease-in-out infinite;
		}

		.icon-btn {
			background: transparent;
			border: 1px solid var(--line);
			border-radius: 50%;
			width: 38px; height: 38px;
			display: flex; align-items: center; justify-content: center;
			cursor: pointer;
			color: var(--muted);
			padding: 0;
			transition: border-color 200ms, color 200ms;
		}

		.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

		/* ── Home view ── */
		.home-main { padding: 48px 40px 60px; }

		.home-header { margin-bottom: 34px; }

		h1 {
			font-size: clamp(1.8rem, 4vw, 2.8rem);
			font-weight: 800;
			letter-spacing: 0.01em;
			line-height: 1.1;
			margin-bottom: 10px;
		}

		.lead { color: var(--muted); font-size: 0.93rem; }

		/* ── Create form ── */
		.form-row {
			display: grid;
			grid-template-columns: 2fr 1.3fr 1.3fr auto;
			gap: 14px;
			align-items: end;
		}

		.field { display: flex; flex-direction: column; gap: 8px; }

		.field label {
			font-size: 0.72rem;
			font-weight: 700;
			letter-spacing: 0.13em;
			text-transform: uppercase;
			color: var(--accent);
		}

		input {
			background: rgba(15, 23, 42, 0.7);
			border: 1px solid rgba(148, 163, 184, 0.2);
			border-radius: 12px;
			color: var(--text);
			height: 52px;
			padding: 0 16px;
			font-size: 0.97rem;
			font-weight: 500;
			font-family: inherit;
			outline: none;
			width: 100%;
			transition: border-color 200ms, box-shadow 200ms;
		}

		input:focus, input:hover {
			border-color: rgba(0, 212, 255, 0.5);
			box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
		}

		input::placeholder { color: rgba(154, 168, 199, 0.45); }

		.btn-field { align-self: end; }

		.btn-start {
			height: 52px;
			width: 100%;
			min-width: 110px;
			background: linear-gradient(120deg, var(--accent), var(--accent-2));
			border: none;
			border-radius: 12px;
			color: #02131d;
			font-size: 0.88rem;
			font-weight: 800;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			cursor: pointer;
			font-family: inherit;
			transition: opacity 200ms, transform 200ms;
		}

		.btn-start:hover  { opacity: 0.9; }
		.btn-start:active { transform: translateY(1px) scale(0.99); }

		.form-status {
			min-height: 20px;
			font-size: 0.83rem;
			color: var(--muted);
			margin-top: 10px;
		}

		.form-status.error { color: var(--danger); }

		/* ── Divider ── */
		.section-divider {
			border: none;
			border-top: 1px solid var(--line);
			margin: 34px 0 20px;
		}

		/* ── Running timers list ── */
		.timers-list-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 14px;
		}

		.timers-lbl {
			font-size: 0.72rem;
			font-weight: 700;
			letter-spacing: 0.16em;
			text-transform: uppercase;
			color: var(--accent);
		}

		.timers-cnt { font-size: 0.83rem; color: var(--muted); }

		.timer-row {
			display: grid;
			grid-template-columns: 48px 1fr 160px 200px 22px;
			align-items: center;
			gap: 18px;
			padding: 16px 18px;
			background: rgba(15, 23, 42, 0.45);
			border: 1px solid rgba(148, 163, 184, 0.12);
			border-radius: 14px;
			cursor: pointer;
			margin-bottom: 10px;
			transition: background 200ms, border-color 200ms;
			outline: none;
		}

		.timer-row:hover, .timer-row:focus-visible {
			background: rgba(15, 23, 42, 0.75);
			border-color: rgba(0, 212, 255, 0.3);
		}

		.timer-row-icon {
			width: 44px; height: 44px;
			border-radius: 11px;
			border: 1px solid;
			display: flex; align-items: center; justify-content: center;
			flex-shrink: 0;
		}

		.timer-row-title { font-size: 0.97rem; font-weight: 600; color: var(--text); }

		.timer-row-dur { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }

		.timer-row-cd { text-align: center; }

		.timer-row-cd-val {
			font-size: 1.55rem;
			font-weight: 700;
			font-variant-numeric: tabular-nums;
			letter-spacing: 0.03em;
			color: #f8fafc;
		}

		.timer-row-cd-lbl { font-size: 0.71rem; color: var(--muted); margin-top: 2px; }

		.timer-row-times { font-size: 0.8rem; color: var(--muted); text-align: right; line-height: 1.8; }

		.timer-row-times strong { color: var(--text); font-weight: 600; }

		/* ── Timer Detail view ── */
		.timer-detail { padding: 28px 40px 90px; }

		.back-link {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			color: var(--accent);
			text-decoration: none;
			font-size: 0.85rem;
			font-weight: 600;
			margin-bottom: 28px;
			transition: opacity 200ms;
		}

		.back-link:hover { opacity: 0.75; }

		.detail-top {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			margin-bottom: 22px;
		}

		.eyebrow {
			font-size: 0.71rem;
			font-weight: 700;
			letter-spacing: 0.2em;
			text-transform: uppercase;
			color: var(--accent-2);
			margin-bottom: 8px;
		}

		.detail-title-row { display: flex; align-items: center; gap: 12px; }

		.detail-title-row h1 { font-size: clamp(1.4rem, 3.5vw, 2.1rem); }

		.edit-btn { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; }

		.status-pill {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			border: 1px solid rgba(0, 212, 255, 0.35);
			border-radius: 999px;
			padding: 6px 14px;
			font-size: 0.77rem;
			font-weight: 700;
			letter-spacing: 0.1em;
			color: var(--accent);
			background: rgba(0, 212, 255, 0.07);
			white-space: nowrap;
			margin-top: 6px;
		}

		.status-pill.completed {
			border-color: rgba(61, 246, 184, 0.35);
			color: var(--accent-2);
			background: rgba(61, 246, 184, 0.07);
		}

		.status-dot {
			width: 7px; height: 7px;
			border-radius: 50%;
			background: var(--accent-2);
			flex-shrink: 0;
			animation: pulseDot 2s ease-in-out infinite;
		}

		.status-pill.completed .status-dot { animation: none; }

		.detail-meta { display: flex; gap: 48px; margin-bottom: 2px; }

		.meta-label {
			font-size: 0.7rem;
			font-weight: 700;
			letter-spacing: 0.13em;
			text-transform: uppercase;
			color: var(--muted);
			margin-bottom: 4px;
		}

		.meta-value { font-size: 1rem; font-weight: 600; color: var(--text); }

		/* ── Clock ── */
		.clock-section {
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 44px 0 36px;
		}

		.clock-label {
			font-size: 0.71rem;
			font-weight: 700;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			color: var(--muted);
			margin-bottom: 14px;
		}

		.clock-display {
			font-size: clamp(4rem, 13vw, 8.5rem);
			font-weight: 800;
			font-variant-numeric: tabular-nums;
			letter-spacing: 0.02em;
			color: #fff;
			line-height: 1;
			margin-bottom: 22px;
		}

		.ends-at-pill {
			display: inline-flex;
			align-items: center;
			gap: 7px;
			background: rgba(10, 20, 40, 0.85);
			border: 1px solid rgba(148, 163, 184, 0.18);
			border-radius: 999px;
			padding: 8px 20px;
			font-size: 0.81rem;
			font-weight: 700;
			letter-spacing: 0.1em;
			color: var(--accent);
		}

		/* ── Detail controls ── */
		.detail-controls {
			display: flex;
			justify-content: center;
			gap: 14px;
			margin-top: 26px;
		}

		.btn-pause, .btn-stop {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			height: 54px;
			padding: 0 36px;
			border-radius: 14px;
			font-size: 0.85rem;
			font-weight: 800;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			cursor: pointer;
			font-family: inherit;
			transition: opacity 200ms, border-color 200ms, color 200ms;
		}

		.btn-pause {
			background: linear-gradient(120deg, var(--accent), var(--accent-2));
			border: none;
			color: #02131d;
		}

		.btn-pause:hover { opacity: 0.9; }

		.btn-stop {
			background: rgba(15, 23, 42, 0.8);
			border: 1px solid rgba(148, 163, 184, 0.2);
			color: var(--text);
		}

		.btn-stop:hover { border-color: rgba(255, 107, 129, 0.6); color: var(--danger); }

		/* ── Floating action button ── */
		.fab {
			position: fixed;
			bottom: 30px; right: 30px;
			width: 56px; height: 56px;
			border-radius: 50%;
			background: linear-gradient(135deg, var(--accent), var(--accent-2));
			border: none;
			color: #02131d;
			display: flex; align-items: center; justify-content: center;
			cursor: pointer;
			box-shadow: 0 6px 24px rgba(0, 212, 255, 0.45);
			transition: transform 200ms, box-shadow 200ms;
			z-index: 50;
		}

		.fab:hover  { transform: scale(1.08); box-shadow: 0 8px 32px rgba(0, 212, 255, 0.55); }
		.fab:active { transform: scale(0.96); }

		/* ── Animations ── */
		@keyframes floatBlob {
			0%, 100% { transform: translate(0, 0) scale(1); }
			50%       { transform: translate(30px, 20px) scale(1.05); }
		}

		@keyframes pulseDot {
			0%, 100% { opacity: 1; transform: scale(1); }
			50%       { opacity: 0.55; transform: scale(0.85); }
		}

		/* ── Responsive ── */
		@media (max-width: 860px) {
			.app-nav, .home-main, .timer-detail { padding-left: 20px; padding-right: 20px; }

			.form-row { grid-template-columns: 1fr 1fr; }
			.btn-field { grid-column: 1 / -1; }
			.btn-start { min-width: unset; }

			.timer-row { grid-template-columns: 44px 1fr auto 22px; }
			.timer-row-times { display: none; }

			.detail-meta { gap: 28px; }
		}

		@media (max-width: 520px) {
			.form-row { grid-template-columns: 1fr; }
			.timer-row { grid-template-columns: 44px 1fr 22px; }
			.timer-row-cd { display: none; }
		}
	</style>
</head>
<body>
	<div id="app"></div>

	<script>
	(function () {
		'use strict';

		/* ════════════════════════════════════════
		   Constants
		════════════════════════════════════════ */
		var STORAGE_KEY_V2 = 'itstimeto-timers-v2';
		var STORAGE_KEY_V1 = 'itstimeto-timer-v1';
		var MIN_DURATION_VALUE = 0.1;
		var MAX_DURATION_VALUE = 24 * 365;

		/* ════════════════════════════════════════
		   State
		════════════════════════════════════════ */
		var timers = [];
		var tickerInterval = null;

		/* ════════════════════════════════════════
		   Utilities
		════════════════════════════════════════ */
		function generateId() {
			return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
		}

		function pad2(v) { return String(v).padStart(2, '0'); }

		function formatHMS(totalSeconds) {
			var s = Math.max(0, Math.floor(totalSeconds));
			return pad2(Math.floor(s / 3600)) + ':' + pad2(Math.floor((s % 3600) / 60)) + ':' + pad2(s % 60);
		}

		function formatTime12(ms) {
			return new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
		}

		function formatStartedAt(ms) {
			var d = new Date(ms);
			var isToday = d.toDateString() === new Date().toDateString();
			var t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
			return (isToday ? 'Today, ' : '') + t;
		}

		function getTimeZone() {
			return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local';
		}

		function hexToRgb(hex) {
			var r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
			return r ? parseInt(r[1], 16) + ',' + parseInt(r[2], 16) + ',' + parseInt(r[3], 16) : '0,212,255';
		}

		/* ════════════════════════════════════════
		   Input parsing (preserved from v1)
		════════════════════════════════════════ */
		function normalizeTimeInput(rawValue) {
			var digits = rawValue.replace(/\D/g, '').slice(0, 4);
			if (digits.length <= 2) return digits;
			return digits.slice(0, 2) + ':' + digits.slice(2);
		}

		function isValidTimePrefix(value) {
			if (!/^\d{0,2}(:\d{0,2})?$/.test(value)) return false;
			var parts = value.split(':');
			var h = parts[0] || '', m = parts[1] || '';
			if (h.length >= 1 && Number(h.charAt(0)) > 2) return false;
			if (h.length === 2 && Number(h) > 23) return false;
			if (m.length >= 1 && Number(m.charAt(0)) > 5) return false;
			if (m.length === 2 && Number(m) > 59) return false;
			return true;
		}

		function parse24HourTime(value) {
			if (!/^\d{2}:\d{2}$/.test(value)) return null;
			var parts = value.split(':'), h = Number(parts[0]), m = Number(parts[1]);
			if (h < 0 || h > 23 || m < 0 || m > 59) return null;
			return { hour: h, minute: m };
		}

		function normalizeDurationInput(rawValue) {
			var s = rawValue.replace(/,/g, '.').replace(/[^\d.]/g, '');
			var dot = s.indexOf('.');
			if (dot !== -1) {
				return s.slice(0, dot).replace(/\./g, '') + '.' + s.slice(dot + 1).replace(/\./g, '').slice(0, 2);
			}
			return s;
		}

		function isValidDurationPrefix(value) {
			if (value === '') return true;
			if (!/^\d+(\.\d{0,2})?$/.test(value)) return false;
			var n = Number(value);
			return Number.isFinite(n) && n <= MAX_DURATION_VALUE;
		}

		function parseDuration(value) {
			if (!/^\d+(\.\d{1,2})?$/.test(value)) return null;
			var n = Number(value);
			if (!Number.isFinite(n) || n < MIN_DURATION_VALUE || n > MAX_DURATION_VALUE) return null;
			var parts = value.split('.');
			var hours = Number(parts[0]);
			var dec = parts[1] ? Number(parts[1].padEnd(2, '0')) : 0;
			var mins = Math.round((dec * 60) / 100);
			var total = hours * 60 + mins;
			if (total < 6 || total > MAX_DURATION_VALUE * 60) return null;
			return { displayValue: value, totalMinutes: total };
		}

		function getStartDateTimeMs(selectedTime) {
			var p = parse24HourTime(selectedTime);
			if (!p) return null;
			var start = new Date();
			start.setHours(p.hour, p.minute, 0, 0);
			return start.getTime();
		}

		/* ════════════════════════════════════════
		   Storage
		════════════════════════════════════════ */
		function saveTimers() {
			localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(timers));
		}

		function loadTimers() {
			try {
				var raw = localStorage.getItem(STORAGE_KEY_V2);
				timers = raw ? JSON.parse(raw) : [];
				if (!Array.isArray(timers)) timers = [];
			} catch (e) {
				timers = [];
			}
			migrateV1();
		}

		function migrateV1() {
			try {
				var raw = localStorage.getItem(STORAGE_KEY_V1);
				if (!raw) return;
				var old = JSON.parse(raw);
				if (!old || !old.endAtMs || old.endAtMs <= Date.now() || !old.selectedTime) return;
				var alreadyMigrated = timers.some(function (t) { return t.migratedFromV1; });
				if (alreadyMigrated) return;
				timers.push({
					id: generateId(),
					title: "Time's Up, Buttercup",
					selectedTime: old.selectedTime,
					selectedDuration: old.selectedDuration || '1.00',
					selectedDurationMinutes: old.selectedDurationMinutes || 60,
					startAtMs: old.startAtMs,
					endAtMs: old.endAtMs,
					timezone: old.timezone || getTimeZone(),
					createdAtMs: old.createdAtMs || Date.now(),
					status: 'running',
					migratedFromV1: true
				});
				saveTimers();
				localStorage.removeItem(STORAGE_KEY_V1);
			} catch (e) { /* ignore */ }
		}

		function cleanupExpiredTimers() {
			var now = Date.now(), before = timers.length;
			timers = timers.filter(function (t) {
				if (t.status === 'stopped') return false;
				/* Keep paused timers regardless of endAtMs – they can be resumed later */
				if (typeof t.pausedElapsed === 'number') return true;
				return t.endAtMs > now;
			});
			if (timers.length !== before) saveTimers();
		}

		function getActiveTimers() {
			return timers.filter(function (t) { return t.status !== 'stopped'; });
		}

		function createTimer(title, selectedTime, duration, startAtMs, endAtMs) {
			var t = {
				id: generateId(),
				title: title || "Time's Up, Buttercup",
				selectedTime: selectedTime,
				selectedDuration: duration.displayValue,
				selectedDurationMinutes: duration.totalMinutes,
				startAtMs: startAtMs,
				endAtMs: endAtMs,
				timezone: getTimeZone(),
				createdAtMs: Date.now(),
				status: 'running'
			};
			timers.push(t);
			saveTimers();
			return t;
		}

		function removeTimer(id) {
			timers = timers.filter(function (t) { return t.id !== id; });
			saveTimers();
		}

		function getTimerById(id) {
			return timers.find(function (t) { return t.id === id; }) || null;
		}

		/* ════════════════════════════════════════
		   Routing
		════════════════════════════════════════ */
		function getRoute() {
			var hash = window.location.hash.slice(1);
			if (hash.indexOf('timer-') === 0) return { view: 'timer', id: hash.slice(6) };
			return { view: 'home' };
		}

		function navigate(hash) {
			window.location.hash = hash || '';
		}

		/* ════════════════════════════════════════
		   Ticker
		════════════════════════════════════════ */
		function clearTicker() {
			if (tickerInterval) { clearInterval(tickerInterval); tickerInterval = null; }
		}

		/* ════════════════════════════════════════
		   SVG helpers
		════════════════════════════════════════ */
		function makeSvg(path, size) {
			var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
			svg.setAttribute('width', size || 20);
			svg.setAttribute('height', size || 20);
			svg.setAttribute('viewBox', '0 0 24 24');
			svg.setAttribute('fill', 'none');
			svg.setAttribute('stroke', 'currentColor');
			svg.setAttribute('stroke-width', '2');
			svg.setAttribute('stroke-linecap', 'round');
			svg.setAttribute('stroke-linejoin', 'round');
			svg.innerHTML = path;
			return svg;
		}

		var SVG = {
			clock:   '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
			gear:    '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
			chevron: '<polyline points="9 18 15 12 9 6"/>',
			arrow:   '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
			plus:    '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
			pause:   '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
			stop:    '<rect x="3" y="3" width="18" height="18" rx="2"/>',
			pencil:  '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>'
		};

		var ICON_COLORS = ['#00d4ff', '#a78bfa', '#fb923c', '#34d399', '#f472b6'];
		function iconColor(i) { return ICON_COLORS[i % ICON_COLORS.length]; }

		/* ════════════════════════════════════════
		   Render dispatcher
		════════════════════════════════════════ */
		function renderView() {
			clearTicker();
			cleanupExpiredTimers();
			var route = getRoute();
			var app = document.getElementById('app');
			app.innerHTML = '';

			if (route.view === 'timer') {
				var timer = getTimerById(route.id);
				if (!timer) { navigate(''); return; }
				renderTimerDetail(app, timer);
			} else {
				renderHome(app);
			}
		}

		/* ════════════════════════════════════════
		   Home view
		════════════════════════════════════════ */
		function renderHome(container) {
			var active = getActiveTimers();
			container.appendChild(buildNav(active.length > 0));

			var main = document.createElement('div');
			main.className = 'home-main';

			var hdr = document.createElement('header');
			hdr.className = 'home-header';

			var h1 = document.createElement('h1');
			h1.textContent = "Time's Up, Buttercup";
			var lead = document.createElement('p');
			lead.className = 'lead';
			lead.textContent = 'Pick a start time and duration, then let the timer track the real remaining time.';
			hdr.appendChild(h1);
			hdr.appendChild(lead);
			main.appendChild(hdr);

			main.appendChild(buildForm());

			if (active.length > 0) {
				main.appendChild(buildTimerList(active));
				startHomeTicker(active);
			}

			container.appendChild(main);
		}

		function buildNav(hasActive) {
			var nav = document.createElement('nav');
			nav.className = 'app-nav';

			var left = document.createElement('div');
			left.className = 'nav-left';
			var homeA = document.createElement('a');
			homeA.href = '#';
			homeA.className = 'nav-home-link';
			homeA.textContent = 'HOME';
			left.appendChild(homeA);
			if (hasActive) {
				var dot = document.createElement('span');
				dot.className = 'nav-active-dot';
				left.appendChild(dot);
			}

			var right = document.createElement('div');
			right.className = 'nav-right';
			var settingsBtn = document.createElement('button');
			settingsBtn.className = 'icon-btn';
			settingsBtn.setAttribute('aria-label', 'Settings');
			settingsBtn.appendChild(makeSvg(SVG.gear, 17));
			right.appendChild(settingsBtn);

			nav.appendChild(left);
			nav.appendChild(right);
			return nav;
		}

		function buildForm() {
			var section = document.createElement('section');
			section.setAttribute('aria-label', 'Create timer');

			var row = document.createElement('div');
			row.className = 'form-row';

			/* Title field */
			var titleField = makeField('TITLE', 'f-title', 'text', 'e.g. Refactor auth module');

			/* Start At field */
			var startField = makeField('START AT', 'f-start', 'text', 'hh:mm');
			var startInput = startField.querySelector('input');
			startInput.setAttribute('inputmode', 'numeric');
			startInput.setAttribute('maxlength', '5');
			startInput.setAttribute('autocomplete', 'off');
			startInput.setAttribute('spellcheck', 'false');
			startInput.dataset.lastValid = '';
			startInput.addEventListener('input', function () {
				var norm = normalizeTimeInput(startInput.value);
				if (isValidTimePrefix(norm)) {
					startInput.value = norm;
					startInput.dataset.lastValid = norm;
				} else {
					startInput.value = startInput.dataset.lastValid || '';
				}
			});

			/* Hours field */
			var hoursField = makeField('HOURS', 'f-hours', 'text', '1.00');
			var hoursInput = hoursField.querySelector('input');
			hoursInput.setAttribute('inputmode', 'decimal');
			hoursInput.setAttribute('autocomplete', 'off');
			hoursInput.setAttribute('spellcheck', 'false');
			hoursInput.value = '1.00';
			hoursInput.dataset.lastValid = '1.00';
			hoursInput.addEventListener('input', function () {
				var norm = normalizeDurationInput(hoursInput.value);
				if (isValidDurationPrefix(norm)) {
					hoursInput.value = norm;
					hoursInput.dataset.lastValid = norm;
				} else {
					hoursInput.value = hoursInput.dataset.lastValid || '';
				}
			});

			/* Start button */
			var btnWrap = document.createElement('div');
			btnWrap.className = 'field btn-field';
			var startBtn = document.createElement('button');
			startBtn.type = 'button';
			startBtn.className = 'btn-start';
			startBtn.textContent = 'START';
			btnWrap.appendChild(startBtn);

			row.appendChild(titleField);
			row.appendChild(startField);
			row.appendChild(hoursField);
			row.appendChild(btnWrap);

			var statusEl = document.createElement('p');
			statusEl.className = 'form-status';
			statusEl.setAttribute('aria-live', 'polite');

			section.appendChild(row);
			section.appendChild(statusEl);

			startBtn.addEventListener('click', function () {
				handleStart(
					document.getElementById('f-title').value.trim(),
					startInput, hoursInput, statusEl
				);
			});

			return section;
		}

		function makeField(labelText, id, type, placeholder) {
			var wrap = document.createElement('div');
			wrap.className = 'field';
			var lbl = document.createElement('label');
			lbl.setAttribute('for', id);
			lbl.textContent = labelText;
			var inp = document.createElement('input');
			inp.id = id;
			inp.type = type;
			inp.placeholder = placeholder;
			wrap.appendChild(lbl);
			wrap.appendChild(inp);
			return wrap;
		}

		function handleStart(title, startInput, hoursInput, statusEl) {
			var selectedTime = startInput.value.trim();
			var selectedDuration = parseDuration(hoursInput.value.trim());

			/* If start time is empty but duration is valid, use current time */
			if (!selectedTime && selectedDuration) {
				var now = new Date();
				selectedTime = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
				startInput.value = selectedTime;
				startInput.dataset.lastValid = selectedTime;
			}

			if (!parse24HourTime(selectedTime)) {
				statusEl.textContent = 'Enter start time as HH:MM in 24-hour format (e.g. 09:00 or 23:54).';
				statusEl.className = 'form-status error';
				startInput.focus();
				return;
			}

			if (!selectedDuration) {
				statusEl.textContent = 'Enter a duration from 0.10 to 8760.00 with up to 2 decimals. Example: 1.50 means 1 h 30 min.';
				statusEl.className = 'form-status error';
				hoursInput.focus();
				return;
			}

			var startAtMs = getStartDateTimeMs(selectedTime);
			if (!startAtMs) {
				statusEl.textContent = 'Invalid start time. Use HH:MM in 24-hour format.';
				statusEl.className = 'form-status error';
				return;
			}

			var endAtMs = startAtMs + selectedDuration.totalMinutes * 60 * 1000;

			/* If the end time is already in the past, roll forward one day */
			if (endAtMs <= Date.now()) {
				startAtMs += 86400000;
				endAtMs   += 86400000;
			}

			var timer = createTimer(
				title || "Time's Up, Buttercup",
				selectedTime, selectedDuration, startAtMs, endAtMs
			);
			navigate('timer-' + timer.id);
		}

		/* ── Running timers list ── */
		function buildTimerList(active) {
			var sec = document.createElement('section');
			sec.setAttribute('aria-label', 'Running timers');

			var hr = document.createElement('hr');
			hr.className = 'section-divider';
			sec.appendChild(hr);

			var hdr = document.createElement('div');
			hdr.className = 'timers-list-header';
			var lbl = document.createElement('span');
			lbl.className = 'timers-lbl';
			lbl.textContent = 'RUNNING TIMERS';
			var cnt = document.createElement('span');
			cnt.className = 'timers-cnt';
			cnt.textContent = active.length + ' active timer' + (active.length !== 1 ? 's' : '');
			hdr.appendChild(lbl);
			hdr.appendChild(cnt);
			sec.appendChild(hdr);

			active.forEach(function (timer, i) { sec.appendChild(buildTimerRow(timer, i)); });

			return sec;
		}

		function buildTimerRow(timer, index) {
			var row = document.createElement('div');
			row.className = 'timer-row';
			row.setAttribute('role', 'button');
			row.setAttribute('tabindex', '0');

			var color = iconColor(index);
			var rgb   = hexToRgb(color);

			var onClick = function () { navigate('timer-' + timer.id); };
			row.addEventListener('click', onClick);
			row.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') onClick(); });

			/* Icon */
			var ico = document.createElement('div');
			ico.className = 'timer-row-icon';
			ico.style.cssText = 'background:rgba(' + rgb + ',0.15);border-color:rgba(' + rgb + ',0.3);color:' + color + ';';
			ico.appendChild(makeSvg(SVG.clock, 20));

			/* Info */
			var info = document.createElement('div');
			var titleEl = document.createElement('div');
			titleEl.className = 'timer-row-title';
			titleEl.textContent = timer.title;
			var durEl = document.createElement('div');
			durEl.className = 'timer-row-dur';
			var durNum = parseFloat(timer.selectedDuration);
			durEl.textContent = timer.selectedDuration + ' hour' + (durNum !== 1 ? 's' : '');
			info.appendChild(titleEl);
			info.appendChild(durEl);

			/* Countdown */
			var cdWrap = document.createElement('div');
			cdWrap.className = 'timer-row-cd';
			var cdVal = document.createElement('div');
			cdVal.className = 'timer-row-cd-val';
			cdVal.id = 'remaining-' + timer.id;
			cdVal.textContent = formatHMS(Math.max(0, (timer.endAtMs - Date.now()) / 1000));
			var cdLbl = document.createElement('div');
			cdLbl.className = 'timer-row-cd-lbl';
			cdLbl.textContent = 'remaining';
			cdWrap.appendChild(cdVal);
			cdWrap.appendChild(cdLbl);

			/* Times */
			var times = document.createElement('div');
			times.className = 'timer-row-times';
			times.innerHTML =
				'<div>Started\u00a0<strong>' + formatTime12(timer.startAtMs) + '</strong></div>' +
				'<div>Ends\u00a0<strong>' + formatTime12(timer.endAtMs) + '</strong></div>';

			/* Chevron */
			var chev = makeSvg(SVG.chevron, 18);
			chev.style.cssText = 'color:var(--muted);flex-shrink:0;';

			row.appendChild(ico);
			row.appendChild(info);
			row.appendChild(cdWrap);
			row.appendChild(times);
			row.appendChild(chev);
			return row;
		}

		function startHomeTicker(activeTimers) {
			tickerInterval = setInterval(function () {
				var now = Date.now(), needRerender = false;
				activeTimers.forEach(function (t) {
					var el = document.getElementById('remaining-' + t.id);
					if (!el) return;
					var rem = Math.floor((t.endAtMs - now) / 1000);
					if (rem <= 0) {
						removeTimer(t.id);
						needRerender = true;
					} else {
						el.textContent = formatHMS(rem);
					}
				});
				if (needRerender) { clearTicker(); renderView(); }
			}, 1000);
		}

		/* ════════════════════════════════════════
		   Timer Detail view
		════════════════════════════════════════ */
		function renderTimerDetail(container, timer) {
			var wrap = document.createElement('div');
			wrap.className = 'timer-detail';

			/* Back link */
			var back = document.createElement('a');
			back.href = '#';
			back.className = 'back-link';
			back.appendChild(makeSvg(SVG.arrow, 16));
			back.appendChild(document.createTextNode('\u00a0Back to all timers'));
			wrap.appendChild(back);

			/* Header */
			var top = document.createElement('div');
			top.className = 'detail-top';

			var topLeft = document.createElement('div');
			var eyebrow = document.createElement('div');
			eyebrow.className = 'eyebrow';
			eyebrow.textContent = 'FOCUS SESSION';
			var titleRow = document.createElement('div');
			titleRow.className = 'detail-title-row';
			var titleEl = document.createElement('h1');
			titleEl.textContent = timer.title;
			var editBtn = document.createElement('button');
			editBtn.className = 'icon-btn edit-btn';
			editBtn.setAttribute('aria-label', 'Edit title');
			editBtn.appendChild(makeSvg(SVG.pencil, 15));
			editBtn.addEventListener('click', function () {
				var nv = prompt('Edit timer title:', timer.title);
				if (nv !== null && nv.trim()) {
					timer.title = nv.trim();
					titleEl.textContent = timer.title;
					saveTimers();
				}
			});
			titleRow.appendChild(titleEl);
			titleRow.appendChild(editBtn);
			topLeft.appendChild(eyebrow);
			topLeft.appendChild(titleRow);

			var statusPill = document.createElement('div');
			statusPill.className = 'status-pill';
			var dot = document.createElement('span');
			dot.className = 'status-dot';
			statusPill.appendChild(dot);
			statusPill.appendChild(document.createTextNode(' RUNNING'));

			top.appendChild(topLeft);
			top.appendChild(statusPill);
			wrap.appendChild(top);

			/* Meta */
			var meta = document.createElement('div');
			meta.className = 'detail-meta';
			var dur = parseFloat(timer.selectedDuration);
			meta.innerHTML =
				'<div class="detail-meta-item"><div class="meta-label">STARTED AT</div><div class="meta-value">' + formatStartedAt(timer.startAtMs) + '</div></div>' +
				'<div class="detail-meta-item"><div class="meta-label">DURATION</div><div class="meta-value">' + timer.selectedDuration + ' hour' + (dur !== 1 ? 's' : '') + '</div></div>';
			wrap.appendChild(meta);

			/* Divider */
			var hr = document.createElement('hr');
			hr.className = 'section-divider';
			wrap.appendChild(hr);

			/* Clock */
			var clockSec = document.createElement('div');
			clockSec.className = 'clock-section';
			var clockLbl = document.createElement('div');
			clockLbl.className = 'clock-label';
			clockLbl.textContent = 'TIME ELAPSED';
			var clockEl = document.createElement('div');
			clockEl.className = 'clock-display';
			var endsAtEl = document.createElement('div');
			endsAtEl.className = 'ends-at-pill';
			endsAtEl.appendChild(makeSvg(SVG.clock, 14));
			endsAtEl.appendChild(document.createTextNode('\u00a0ENDS AT ' + formatTime12(timer.endAtMs)));
			clockSec.appendChild(clockLbl);
			clockSec.appendChild(clockEl);
			clockSec.appendChild(endsAtEl);
			wrap.appendChild(clockSec);

			/* Controls */
			var ctrlRow = document.createElement('div');
			ctrlRow.className = 'detail-controls';

			/* Pause/Resume state — stored as elapsed seconds at pause time */
			var pausedElapsed = (typeof timer.pausedElapsed === 'number') ? timer.pausedElapsed : null;
			var isPaused = pausedElapsed !== null;

			var pauseBtn = document.createElement('button');
			pauseBtn.type = 'button';
			pauseBtn.className = 'btn-pause';

			function syncPauseBtn() {
				pauseBtn.innerHTML = '';
				pauseBtn.appendChild(makeSvg(isPaused ? SVG.clock : SVG.pause, 16));
				pauseBtn.appendChild(document.createTextNode(isPaused ? '\u00a0RESUME' : '\u00a0PAUSE'));
			}
			syncPauseBtn();

			pauseBtn.addEventListener('click', function () {
				if (isPaused) {
					/* Resume: shift startAtMs so elapsed stays consistent */
					var shift = Date.now() - (timer.startAtMs + pausedElapsed * 1000);
					timer.startAtMs += shift;
					timer.endAtMs   += shift;
					delete timer.pausedElapsed;
					pausedElapsed = null;
					isPaused = false;
					syncPauseBtn();
					dot.style.animation = '';
					statusPill.className = 'status-pill';
					statusPill.lastChild.textContent = ' RUNNING';
					saveTimers();
					tick();
					tickerInterval = setInterval(tick, 1000);
				} else {
					/* Pause: capture current elapsed and stop ticker */
					clearTicker();
					pausedElapsed = Math.floor((Date.now() - timer.startAtMs) / 1000);
					if (pausedElapsed < 0) pausedElapsed = 0;
					timer.pausedElapsed = pausedElapsed;
					isPaused = true;
					syncPauseBtn();
					dot.style.animation = 'none';
					statusPill.className = 'status-pill';
					statusPill.lastChild.textContent = ' PAUSED';
					saveTimers();
				}
			});

			var stopBtn = document.createElement('button');
			stopBtn.type = 'button';
			stopBtn.className = 'btn-stop';
			stopBtn.appendChild(makeSvg(SVG.stop, 16));
			stopBtn.appendChild(document.createTextNode('\u00a0STOP'));
			stopBtn.addEventListener('click', function () {
				if (confirm('Stop "' + timer.title + '"?')) {
					removeTimer(timer.id);
					navigate('');
				}
			});

			ctrlRow.appendChild(pauseBtn);
			ctrlRow.appendChild(stopBtn);
			wrap.appendChild(ctrlRow);
			container.appendChild(wrap);

			/* Floating action button */
			var fab = document.createElement('button');
			fab.className = 'fab';
			fab.setAttribute('aria-label', 'New timer');
			fab.title = 'Create new timer';
			fab.appendChild(makeSvg(SVG.plus, 22));
			fab.addEventListener('click', function () { navigate(''); });
			container.appendChild(fab);

			/* Ticker – updates elapsed clock every second */
			function tick() {
				if (isPaused) return; /* frozen while paused */
				var now = Date.now();
				var elapsed = Math.floor((now - timer.startAtMs) / 1000);
				if (elapsed < 0) elapsed = 0;
				var total = Math.floor((timer.endAtMs - timer.startAtMs) / 1000);
				if (elapsed >= total) {
					clockEl.textContent = formatHMS(total);
					dot.style.animation = 'none';
					statusPill.className = 'status-pill completed';
					statusPill.lastChild.textContent = ' COMPLETED';
					removeTimer(timer.id);
					clearTicker();
					return;
				}
				clockEl.textContent = formatHMS(elapsed);
			}

			/* If restored as paused, show the frozen elapsed value */
			if (isPaused) {
				clockEl.textContent = formatHMS(pausedElapsed);
				dot.style.animation = 'none';
				statusPill.lastChild.textContent = ' PAUSED';
			} else {
				tick();
				tickerInterval = setInterval(tick, 1000);
			}
		}

		/* ════════════════════════════════════════
		   Bootstrap
		════════════════════════════════════════ */
		loadTimers();
		cleanupExpiredTimers();
		window.addEventListener('hashchange', renderView);
		renderView();

	})();
	</script>
</body>
</html>
