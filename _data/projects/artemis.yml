# Engineering reflection
what_id_do_differently: |
  If starting over, I'd design the club membership data model to support tiered roles (moderators, regulars, newcomers) from day one—adding hierarchy later required migration logic. I'd also implement rate limiting on virtual drink sends earlier to prevent spammy behavior during beta testing. [ASSUMED — replace with your real reflection]

# Call to action
investor_cta: Open to early beta users, social-app angels, advisors with community-building experience [ASSUMED]

# Legacy description (keep for backward compatibility)
full_description:
- Artemis is a virtual club app that brings the essence of real-world clubs to the digital space. Built using Flutter and Firebase, it helps people discover communities around their passions.
- Users can join clubs for sports, literature, movies, comedy, or location-based meetups, with thoughtful entry limits to keep the vibe balanced. They can buy virtual drinks for others and spark one-to-one chats that feel natural and personal.
- Whether you are sharing a passion, meeting like-minded individuals, or simply unwinding, Artemis creates an immersive club experience anywhere.

