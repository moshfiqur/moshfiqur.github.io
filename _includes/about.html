<div id="about">
  <div class="container">
    <div class="section-title text-center center">
      <h2>About Me</h2>
      <hr>
    </div>
    <div class="row">
      <div class="col-md-12 text-center" style="margin-bottom: 40px;">
        <img src="{{ site.baseurl }}/img/about_me.jpg" alt="Moshfiqur Rahman" class="about-avatar" style="width: 200px; height: 200px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
      </div>
    </div>
    <div class="row">
      <div class="col-md-8 col-md-offset-2">
        <div class="about-text" style="font-size: 1.8rem; text-align: justify;">
          {% for paragraph in site.data.site.about.paragraphs %}
          <p>{{ paragraph }}</p>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</div>
