<div id="resume" class="text-center">
  <div class="container">
    <div class="section-title center">
      <h2>Experience</h2>
      <hr>
    </div>
    <div class="row">
      <div class="col-lg-12">
        <ul class="timeline">
          {% for job in site.data.experience %}
          <li{% if job.inverted %} class="timeline-inverted"{% endif %}>
            <div class="timeline-image">
              <h4>{{ job.date_range }}</h4>
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>{{ job.company }}</h4>
                <h4 class="subheading">{{ job.position }}</h4>
              </div>
              <div class="timeline-body">
                <p>{{ job.description }}</p>
              </div>
            </div>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</div>
