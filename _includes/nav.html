<div id="nav">
  <nav class="navbar navbar-custom">
    <div class="container">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-main-collapse">
          <i class="fa fa-bars"></i>
        </button>
        <a class="navbar-brand page-scroll" href="/" style="font-size: 3.5rem;">{{ site.data.site.name }}</a>
      </div>
      
      <!-- Collect the nav links, forms, and other content for toggling -->
      <div class="collapse navbar-collapse navbar-right navbar-main-collapse">
        <ul class="nav navbar-nav">
          <li class="hidden"> <a href="/"></a> </li>
          {% for item in site.data.site.navigation %}
          <li>
            {% if item.external %}
            <a href="{{ item.url }}">{{ item.name }}</a>
            {% else %}
            <a class="page-scroll" href="{{ item.url }}">{{ item.name }}</a>
            {% endif %}
          </li>
          {% endfor %}
          <li class="theme-switcher">
            <div class="theme-toggle" data-theme-toggle>
              <button type="button" class="theme-toggle-trigger" data-theme-toggle-trigger aria-haspopup="listbox" aria-expanded="false" aria-label="Theme selection">System</button>
              <ul class="theme-toggle-menu" role="listbox" aria-label="Select theme">
                <li>
                  <button type="button" class="theme-toggle-option" data-theme-value="light" role="option" aria-selected="false">Light</button>
                </li>
                <li>
                  <button type="button" class="theme-toggle-option" data-theme-value="dark" role="option" aria-selected="false">Dark</button>
                </li>
                <li>
                  <button type="button" class="theme-toggle-option" data-theme-value="system" role="option" aria-selected="false">System</button>
                </li>
              </ul>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>
