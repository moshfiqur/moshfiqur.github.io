# Core messaging
headline: Ship storyboard backends without reinventing the wheel
tagline: Creative Storyboard API handles auth, media, and analytics so teams can build fast.

# Target audience
target_user: Product teams building creative planning tools who need a ready-made backend for media-heavy workflows [ASSUMED]

# Problem statement
the_problem: |
  Building a reliable media backend takes time: authentication, uploads, storage hygiene, and analytics. Teams often build custom endpoints for each new project and end up with fragile systems. File uploads introduce security risks and performance pitfalls. Without a solid foundation, frontends move fast but the backend slows everything down.

# Solution statement
the_solution: |
  Creative Storyboard API lets product teams plug in a secure Node.js backend for projects, scenes, and shots so they can focus on UX instead of infrastructure.

# Market context
market_opportunity: |
  Creative tooling is growing, but most teams lack backend engineering capacity. Reusable API layers reduce time-to-market for niche apps. A reliable media-first backend is a differentiator for teams working with large assets. [ASSUMED]

# Feature highlights
key_features:
  - name: Auth and Session Security
    description: Cookie-based sessions with bcrypt-hardened login. Protects creative assets and team data.

  - name: Projects → Scenes → Shots CRUD
    description: Structured endpoints for nested content. Keeps data consistent across complex workflows.

  - name: Media Upload Pipeline
    description: Multer-driven uploads with validation and cleanup. Prevents broken or unsafe files from entering the system. [ASSUMED]

  - name: Analytics and Activity Logs
    description: Aggregate stats and audit trails for team visibility. Helps managers track progress. [ASSUMED]

  - name: Audio Library Search
    description: Fuzzy search over local sound assets. Speeds up reference selection. [ASSUMED]

# Technical architecture
tech_stack_groups:
  backend: Node.js, Express
  storage: MySQL
  other: Multer, bcryptjs, body-parser, cors, dotenv, mysql2 [ASSUMED]

# Project status
status_label: Prototype stage — seeking first beta users [ASSUMED]

# Engineering reflection
what_id_do_differently: |
  If starting over, I'd formalize the API versioning scheme earlier to support future clients. I'd also add a file-scanning step to the upload pipeline to reduce security review time. [ASSUMED — replace with your real reflection]

# Call to action
investor_cta: Open to beta partners, advisors in API SaaS, and technical co-builders [ASSUMED]

# Legacy description (keep for backward compatibility)
full_description:
- Creative Storyboard API powers the storyboard planning platform with a secure Node.js/Express backend, exposing endpoints for authentication, dashboard analytics, project -> scene -> shot hierarchies, and rich media management (uploads plus audio-library linking).
- Key features include cookie-based sessions with bcrypt-hardened login, activity logging, aggregated stats, MySQL-backed CRUD for nested resources, multer-powered media uploads with file hygiene, and fuzzy-search across a local sound library.
- The stack combines Express, mysql2, bcryptjs, multer, body-parser, cors, dotenv, and vanilla SPA docs, running on Node.js and MySQL--ready to drop behind any Next.js or React frontend.
